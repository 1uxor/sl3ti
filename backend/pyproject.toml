[project]
name = "sl3ti-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "argon2-cffi>=23,<26", "email-validator>=2,<3", "python-multipart>=0.0.9,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'
[tool.setuptools.packages.find]
include = ['app*']
