name: sl3ti_mobile
description: Sl3ti Inventory Management Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # Secure Storage
  flutter_secure_storage: ^9.2.0

  # Images
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0

  # i18n
  intl: ^0.19.0

  # UI
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
